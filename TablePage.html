<!DOCTYPE html>
<html>
<head>
<title>Table page</title>
</head>
<body>

    <table border="5" cellpadding="15" cellspacing="5">
        <tr>
            <th>Name</th>
            <th>Age</th>
            <th>Height</th>
        </tr>
        <tr>
            <td>Ahmed</td>
            <td>20</td>
            <td>173</td>
        </tr>
        <tr>
            <td colspan="2" bgcolor="yellow" align="center">double col span</td>
            <td>A</td>
        </tr>
        <tr>
            <td rowspan="2" align="center" >row span</td>
            <td>B</td>
            <td>C</td>
        </tr>
        <tr>
            <td>f</td>
            <td>c</td>
        </tr>
    </table>

</body>
</html>
