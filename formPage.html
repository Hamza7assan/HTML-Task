<!DOCTYPE html>
<html>
<head>
<title>Form page</title>
</head>
<body>

    <h2>Application Form</h2>
    
    <form action="#" method="post">
        
        <label>First Name:</label>
        <input type="text" name="first_name"> 
        &nbsp;&nbsp;&nbsp;
        <label>Last Name:</label>
        <input type="text" name="last_name"><br><br>
        
        <label>Date of birth:</label>
        <input type="date" name="dob"> 
        &nbsp;&nbsp;&nbsp;
        <label>Age:</label>
        <input type="number" name="age"><br><br>
        
        <label>Gender:</label>
        <select name="gender">
            <option value="male">Male</option>
            <option value="female">Female</option>
        </select>
        &nbsp;&nbsp;&nbsp;
        <label>Email Address:</label>
        <input type="email" name="email" placeholder="Enter email address"><br><br>
        
        <label>Positions Available:</label>
        <input type="radio" id="junior" name="position" value="junior">
        <label for="junior">Junior Developer</label>
        
        <input type="radio" id="mid" name="position" value="mid">
        <label for="mid">Mid-level Developer</label>
        
        <input type="radio" id="senior" name="position" value="senior">
        <label for="senior">Senior Developer</label><br><br>
        
        <label>Programming Languages:</label>
        <input type="checkbox" id="java" name="language" value="java">
        <label for="java">Java</label>
        
        <input type="checkbox" id="js" name="language" value="javascript">
        <label for="js">JavaScript</label>
        
        <input type="checkbox" id="python" name="language" value="python">
        <label for="python">Python</label><br><br>
        
        <label>Password:</label>
        <input type="password" name="password">
        &nbsp;&nbsp;&nbsp;
        <label>Confirm Password:</label>
        <input type="password" name="confirm_password"><br><br>
        
        <input type="submit" value="Submit">
        <input type="reset" value="Reset">
        
    </form>

</body>
</html>
